name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        # The Gradle daemon must run on JDK 25 (since 6.0.0 — KVision 9.6.0's plugin requires it);
        # see CLAUDE.md "Build Commands".
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -x jsBrowserTest

      - name: Run tests
        # :conformance:test also runs in the Build step (via check); listing it here keeps the
        # repository write/lifecycle conformance suite — including the Mongo/Testcontainers leg
        # (blueprints/repository-write-lifecycle, LEDGER D11) — an explicit, non-silent CI gate.
        run: ./gradlew :core:allTests :ssr:test :conformance:test

      - name: Run browser tests
        # The only jsTest source set lives in :fullstack (guard/i18n/caption suites among them —
        # blueprints/view-consumer-gaps, LEDGER L-010/ACS-07). The Build step excludes
        # jsBrowserTest, so without this step those tests were local-only evidence. Karma runs
        # ChromeHeadless; ubuntu runners ship Chrome at /usr/bin/google-chrome.
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: ./gradlew :fullstack:jsBrowserTest
